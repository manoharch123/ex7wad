<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            margin: 40px auto;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }

        .error {
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration Form</h2>

    <form onsubmit="return validateForm()">

        <label>Name</label>
        <input type="text" id="name">
        <div class="error" id="nameError"></div>

        <label>Email</label>
        <input type="email" id="email">
        <div class="error" id="emailError"></div>

        <label>Password</label>
        <input type="password" id="password">
        <div class="error" id="passwordError"></div>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword">
        <div class="error" id="confirmPasswordError"></div>

        <label>Mobile Number</label>
        <input type="text" id="mobile">
        <div class="error" id="mobileError"></div>

        <label>Gender</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <div class="error" id="genderError"></div>

        <label>
            <input type="checkbox" id="terms"> Accept Terms & Conditions
        </label>
        <div class="error" id="termsError"></div>

        <button type="submit">Register</button>
    </form>
</div>

<script>
function validateForm() {
    let valid = true;

    document.querySelectorAll(".error").forEach(e => e.innerHTML = "");

    if (document.getElementById("name").value.trim() === "") {
        nameError.innerHTML = "Name is required";
        valid = false;
    }

    let email = document.getElementById("email").value;
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        emailError.innerHTML = "Invalid email format";
        valid = false;
    }

    let password = document.getElementById("password").value;
    if (password.length < 8) {
        passwordError.innerHTML = "Minimum 8 characters required";
        valid = false;
    }

    if (password !== document.getElementById("confirmPassword").value) {
        confirmPasswordError.innerHTML = "Passwords do not match";
        valid = false;
    }

    if (!/^\d{10}$/.test(document.getElementById("mobile").value)) {
        mobileError.innerHTML = "Enter 10 digit mobile number";
        valid = false;
    }

    if (!document.querySelector('input[name="gender"]:checked')) {
        genderError.innerHTML = "Select gender";
        valid = false;
    }

    if (!document.getElementById("terms").checked) {
        termsError.innerHTML = "Accept terms to continue";
        valid = false;
    }

    return valid;
}
</script>

</body>
</html>
